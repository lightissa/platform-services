---
- name: Install Docker
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Ensure the target is Debian or Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts["distribution"] in ["Debian", "Ubuntu"]
        fail_msg: "This playbook supports Debian and Ubuntu only."

    - name: Install packages required for the Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - python3-debian
        state: present

    - name: Create the APT keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the official Docker repository key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Configure the official Docker CE repository
      ansible.builtin.deb822_repository:
        name: docker
        types: [deb]
        uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
        suites: ["{{ ansible_facts['distribution_release'] }}"]
        components: [stable]
        architectures:
          - "{{ ansible_facts['architecture'] | replace('x86_64', 'amd64') | replace('aarch64', 'arm64') }}"
        signed_by: /etc/apt/keyrings/docker.asc
        state: present

    - name: Install Docker CE and its plugins
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable and start the Docker service
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
