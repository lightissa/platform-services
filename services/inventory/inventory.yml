all:
  children:
    servers:
      hosts:
        cloudtool:
          ansible_host: "{{ lookup('ansible.builtin.env', 'ANSIBLE_HOST') }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'ANSIBLE_USER') }}"
          ansible_ssh_private_key_file: "{{ lookup('ansible.builtin.env', 'ANSIBLE_SSH_PRIVATE_KEY_FILE') }}"
          ansible_python_interpreter: "{{ lookup('ansible.builtin.env', 'ANSIBLE_PYTHON_INTERPRETER') }}"